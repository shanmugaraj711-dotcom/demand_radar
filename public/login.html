<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#185fa5">
<title>Demand Radar: sign in</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main style="max-width:380px;padding-top:12vh">
  <div class="card">
    <h2 style="margin-bottom:4px">Demand Radar</h2>
    <p class="sub" style="margin-bottom:14px">Enter your PIN to continue.</p>
    <form id="f">
      <label class="f">PIN
        <input id="pin" type="password" inputmode="text" autocomplete="current-password" autofocus required>
      </label>
      <div id="err" class="notice err" style="margin-top:10px" hidden></div>
      <button class="btn pri" style="width:100%;margin-top:12px" type="submit">Sign in</button>
    </form>
  </div>
</main>
<script src="login.js"></script>
</body>
</html>
